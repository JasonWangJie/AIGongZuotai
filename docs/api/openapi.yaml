components:
  parameters:
    ResourceID:
      in: path
      name: id
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: 按工作区和操作去重；PostgreSQL模式跨重启持久，memory模式限当前进程。网络重试必须保持原键与payload。
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[a-zA-Z0-9._:-]+$
    ProjectHeader:
      in: header
      name: X-Project-ID
      schema:
        type: string
      description: 可选当前项目；必须属于当前工作区，与project_id查询参数同时提供时应一致。
  responses:
    Error:
      description: JSON业务错误附服务端request_id。429准入拒绝带Retry-After:3且本次未新受理；不能用一次重试拒绝清除以前受理未知的原请求。DB失联503停止执行，不回退memory。
        PG通知积压满时变更返回503 EVENT_BACKLOG_FULL，业务与事件事务一起回滚，原幂等键可在恢复后重试；这不同于提交结果未知。事件游标无效400 INVALID_EVENT_CURSOR，未来游标409
        EVENT_CURSOR_AHEAD。 账户安全：MAIL_UNAVAILABLE=503，AUTH_DISABLED=409，AUTH_REQUIRED=401，ACCOUNT_TOKEN_INVALID=400。安全操作缺失响应不代表未执行，核对账户/重新登录，不能盲目重投密码或令牌。
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/HTTPError'
      headers:
        X-Request-ID:
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 认证限流900秒、bcrypt槽位或资源准入繁忙3秒；只对实际带此头的响应生效。
  schemas:
    ResourceError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    RunInput:
      type: object
      additionalProperties: false
      required:
      - project_id
      - model_id
      - input
      properties:
        project_id:
          type: string
          description: 必须属于当前认证工作区
        model_id:
          type: string
          description: 平台目录模型ID；历史记录可引用已停用或移除模型。
        input:
          type: string
          minLength: 1
          description: 非空白合法UTF-8，不超过模型max_prompt_bytes和平台16000字节上限；整个请求64KiB以内。
        model_version:
          type: string
          description: Input可省略以兼容旧客户端；新请求携带已读版本，过期409 MODEL_VERSION_CHANGED。历史记录为受理时快照，旧记录可缺失。
        quote_id:
          type: string
          maxLength: 128
          description: credits模式新请求必须使用完整原输入对应的有效报价；旧键重放须保留原quote_id和正文，先于过期/余额检查。disabled模式不得提供。
    TaskInput:
      type: object
      additionalProperties: false
      required:
      - project_id
      - kind
      - model_id
      - inputs
      properties:
        project_id:
          type: string
          description: 必须属于当前认证工作区
        kind:
          type: string
          enum:
          - image
          - video
        model_id:
          type: string
          description: 平台目录模型ID；历史记录可引用已停用或移除模型。
        inputs:
          type: object
          additionalProperties: false
          required:
          - prompt
          properties:
            prompt:
              type: string
              minLength: 1
              description: 非空白合法UTF-8，不超过模型max_prompt_bytes和平台16000字节上限。
            reference_asset_ids:
              type: array
              maxItems: 4
              uniqueItems: true
              items:
                type: string
              description: 有序私有参考ID，edit至少1项；generate不得含参考。原未知请求重试保留原顺序和全部字段。
        parameters:
          $ref: '#/components/schemas/TaskParameters'
        model_version:
          type: string
          description: Input可省略以兼容旧客户端；新请求携带已读版本，过期409 MODEL_VERSION_CHANGED。历史记录为受理时快照，旧记录可缺失。
        operation:
          type: string
          enum:
          - generate
          - edit
          description: 省略按generate处理；edit只支持image，必须提供本项目1至4个有序且不重复的私有参考ID。
        quote_id:
          type: string
          maxLength: 128
          description: credits模式新请求必须使用完整原输入对应的有效报价；旧键重放须保留原quote_id和正文，先于过期/余额检查。disabled模式不得提供。
