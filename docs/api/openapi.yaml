      - id
      - project_id
      - name
      - content_type
      - byte_size
      - width
      - height
      - created_at
      - url
      - thumbnail_url
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
          maxLength: 120
          description: 移除目录段/控制字符后的展示名，不用于私有文件路径。
        content_type:
          type: string
          enum:
          - image/png
          - image/jpeg
          - image/webp
        byte_size:
          type: integer
          minimum: 1
          maximum: 8388608
        width:
          type: integer
          minimum: 1
          maximum: 8192
        height:
          type: integer
          minimum: 1
          maximum: 8192
        created_at:
          type: string
          format: date-time
        url:
          type: string
