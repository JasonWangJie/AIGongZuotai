            Cache-Control:
              schema:
                type: string
              description: private, no-cache；仅在当前身份缓存复用。
            X-Request-ID:
              schema:
                type: string
              description: 服务端请求编号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalog'
        '304':
          description: 当前身份已获授权且目录未变化，无body；客户端复用当前作用域缓存。
          headers:
            ETag:
              schema:
                type: string
              description: 当前目录强ETag；在身份校验之后处理If-None-Match。
            Cache-Control:
              schema:
                type: string
              description: private, no-cache；仅在当前身份缓存复用。
