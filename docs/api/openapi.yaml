openapi: 3.1.0
info:
  title: AI 工作台本地开发 API
  version: 0.13.0
  description: '回环单写工作台。默认memory+demo；DATABASE_URL启用PostgreSQL，AUTH_MODE=required启用真实cookie会话和工作区隔离。LLM与已配置异步媒体支持live，逐模型能力以models[].capabilities为准。PG持久化创建、幂等、检查点和handle；重启未完成LLM为INTERRUPTED，提交不明不重发。
    V03支持PostgreSQL项目云草稿与不可变修订/CAS；V04提供同事务业务活动审计（非计费），不记录prompt/output/凭据。 V05增加工作区资源准入、缓存就绪检查、私有工作区运行状态、独立运维令牌Prometheus指标和服务端request_id；不是分布式配额或供应商健康检测。
    V06支持版本化有限模型目录和精确规格预设，目录启动加载、更改重启生效；已受理媒体原始提交体冻结，不随模型目录改写。 V07增加私有参考图片上传、512像素预览、有序引用编辑和不可变multipart请求文件；目录及模型声明不替代真实供应商验收。
    V08提供独立私有资产目录和S3兼容后端；V09支持持久元数据回放和任务租约；V10增加项目私有多轮会话、不可变消息分支与受理时冻结的上下文预算，继续生成是显式新请求。 V11增加邮箱验证、密码找回/变更、会话撤销和账户私有安全事件；邮件默认关闭，配置后通过加密持久队列异步发送。敏感请求响应不明时先核对或重新登录，不沿用生成请求的自动重试语义。
    V12增加CREDIT六位精度权益报价、同事务冻结/结算、待核实、流水与离线核账；默认关闭，无真实支付接口。 V14-A增加默认关闭的工作区运营权限、异常工单、预演与密码确认处置；没有在线角色授予、真实退款或完整内容审核。

    V14-B1仅文本审核本地链：开启后全文检查前不公开delta，真实审核商和多模态分别待验收。'
servers:
- url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      security: []
      description: 仅进程存活。数据库熔断或应用停止接单后，只要HTTP处理仍运行就返回200。
      responses:
        '200':
          description: 进程仍能响应HTTP
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: alive
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
  /api/v1/bootstrap:
    get:
      operationId: bootstrap
      responses:
        '200':
          description: 当前身份工作区、项目与版本化模型目录
          content:
            application/json:
              schema:
                type: object
                required:
                - workspace
                - project
                - models
                - mode
                - storage
                - catalog_version
                - reference_limits
                - account_security
                - billing
                properties:
                  workspace:
                    $ref: '#/components/schemas/Workspace'
                  project:
                    $ref: '#/components/schemas/Project'
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
                  mode:
                    type: string
                    enum:
                    - demo
                    - live
                  storage:
                    type: string
                    enum:
                    - memory
                    - postgres
                  auth_enabled:
                    type: boolean
                  user:
                    anyOf:
                    - $ref: '#/components/schemas/User'
                    - type: 'null'
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  capabilities:
                    type: object
                    description: 兼容旧客户端的按kind聚合提示；v0.5客户端以每个Model.capabilities为准。
                    properties:
                      chat:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                          cancel_supported:
                            type: boolean
                          max_count:
                            type: integer
                          aspect_ratios:
                            type: array
                            items:
                              type: string
                      image:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                          cancel_supported:
                            type: boolean
                          max_count:
                            type: integer
                          aspect_ratios:
                            type: array
                            items:
                              type: string
                      video:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                          cancel_supported:
                            type: boolean
                          max_count:
                            type: integer
                          aspect_ratios:
                            type: array
                            items:
                              type: string
                  catalog_version:
                    type: string
                  reference_limits:
                    $ref: '#/components/schemas/ReferenceLimits'
                  account_security:
                    $ref: '#/components/schemas/AccountSecurityCapabilities'
                  billing:
                    $ref: '#/components/schemas/BillingCapabilities'
                  moderation:
                    $ref: '#/components/schemas/ModerationCapability'
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/ProjectHeader'
  /api/v1/runs:
    get:
      operationId: listRuns
      responses:
        '200':
          description: 所选项目的历史页，创建时间倒序；PG按需读取，客户端按ID去重。
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
                    description: 页满时保守为true，下一页可能为空；offset在并发新增时可能重复。
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - $ref: '#/components/parameters/ProjectHeader'
    post:
      operationId: createRun
      description: '同键同输入返回当前原运行，同键不同输入 409；排队满 503。不自动重发模型。 幂等重放先于准入；新请求超工作区/模型额度429 ADMISSION_WORKSPACE_LIMIT/ADMISSION_MODEL_LIMIT，不新增资源/幂等/审计。终态释放，未知/待核实保留占用。
        幂等命中先于当前模型启停/版本/参数校验；新请求禁用模型或无效预设422，旧能力版本409 MODEL_VERSION_CHANGED。新媒体受理时冻结精确上游字节；预V06无原始提交体且无handle的live排队任务保守进入待核实，不猜测新模型配置。

        审核开启时原键优先。新文本先审核实际完整上下文，锁外调用后重核摘要/CAS；确定拒绝不生成/冻结。MODERATION_INPUT_BLOCKED(422)、MODERATION_INPUT_REVIEW(409)、MODERATION_INPUT_INVALID(422)、MODERATION_UNAVAILABLE(503)、MODERATION_BUSY(429)均为前置未受理；先前受理不明的请求仍保留原body/key。新媒体返回MODERATION_MEDIA_UNSUPPORTED(422)。'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInput'
      responses:
        '201':
          description: 运行已创建或幂等重放
          headers:
            Idempotency-Replayed:
              description: 仅幂等重放时为 true
              schema:
                type: string
                const: 'true'
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/runs/{id}/snapshot:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getRunSnapshot
      responses:
        '200':
          description: 运行完整输出和当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
  /api/v1/runs/{id}/events:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: subscribeRun
      description: 'SSE id为Run.seq；message.delta={run_id,seq,delta}。终态run.completed/run.cancelled/run.failed/run.interrupted={run_id,seq,status}。超窗或重启后run.snapshot为完整Run。Last-Event-ID优先after；历史已落PG但事件环未持久，提供完整快照。seq单调允许恢复跳号，恢复保留段严格超过可能未持久的事件上界。
        工作区SSE上限429 ADMISSION_STREAM_LIMIT，全局128上限503 STREAM_LIMIT，两者Retry-After:3。断开释放，非取消生成。

        有审核摘要的运行不发未审message.delta；输出仅在全文允许及COMPLETED提交后以run.snapshot完整交付，终态可只读补GET。关闭配置不放行旧隔离内容。'
      parameters:
      - in: query
        name: after
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: header
        name: Last-Event-ID
        schema:
          type: string
          pattern: ^[0-9]+$
      - in: query
        name: project_id
        schema:
          type: string
      responses:
        '200':
          description: 有界事件回放、实时增量或完整快照；15秒心跳
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: 1

                event: message.delta

                data: {"run_id":"run_example","seq":1,"delta":"你好"}


                '
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/runs/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: cancelRun
      description: 取消运行context；已终态不改变。取消不能证明上游停止计费。
      responses:
        '200':
          description: 当前运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tasks:
    get:
      operationId: listTasks
      responses:
        '200':
          description: 所选项目的历史页，创建时间倒序；PG按需读取，客户端按ID去重。
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
                    description: 页满时保守为true，下一页可能为空；offset在并发新增时可能重复。
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - $ref: '#/components/parameters/ProjectHeader'
    post:
      operationId: createTask
      description: 'demo或已配置的真实异步媒体；未配置501。相同工作区+操作+幂等键不同输入409。PG持久精确上游请求和受理handle。 幂等重放先于准入；新请求超工作区/模型额度429 ADMISSION_WORKSPACE_LIMIT/ADMISSION_MODEL_LIMIT，不新增资源/幂等/审计。终态释放，未知/待核实保留占用。
        幂等命中先于当前模型启停/版本/参数校验；新请求禁用模型或无效预设422，旧能力版本409 MODEL_VERSION_CHANGED。新媒体受理时冻结精确上游字节；预V06无原始提交体且无handle的live排队任务保守进入待核实，不猜测新模型配置。
        编辑先验证有序reference_asset_ids归属及模型编辑能力，受理前冻结multipart文件；数据表只保存内容摘要/长度/Content-Type/文件ID，不保存图片Base64。文件缺失/损坏在上游前拒绝，仍保留原任务身份；没有mask或直接外部URL编辑接口。

        审核开启时原键优先。新文本先审核实际完整上下文，锁外调用后重核摘要/CAS；确定拒绝不生成/冻结。MODERATION_INPUT_BLOCKED(422)、MODERATION_INPUT_REVIEW(409)、MODERATION_INPUT_INVALID(422)、MODERATION_UNAVAILABLE(503)、MODERATION_BUSY(429)均为前置未受理；先前受理不明的请求仍保留原body/key。新媒体返回MODERATION_MEDIA_UNSUPPORTED(422)。'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '202':
          description: 已受理或幂等重放，尚未代表完成
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/tasks/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getTask
      responses:
        '200':
          description: 当前媒体任务快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tasks/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: cancelTask
      description: demo支持取消；live供应商未提供取消确认时返回409 CANCEL_UNSUPPORTED，原状态保留继续查询。
      responses:
        '200':
          description: 当前媒体任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
  /demo-assets/{file}:
    get:
      operationId: getDemoAsset
      security: []
      parameters:
      - in: path
        name: file
        required: true
        schema:
          type: string
          enum:
          - image-1.svg
          - image-2.svg
          - image-3.svg
          - image-4.svg
          - video-poster.svg
      responses:
        '200':
          description: 本地SVG；视频仅模拟海报，不是视频文件
          content:
            image/svg+xml:
              schema:
                type: string
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        '404':
          description: 未知静态产物
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
  /api/v1/workspaces/{workspace_id}/events:
    get:
      operationId: subscribeWorkspace
      description: PG模式按项目持久通知流：resource.changed仅含资源标识/版本/状态和闭集动作；task.updated附带读取时当前授权Task快照，不能视为事件当时的完整快照。通知序号独立于Task.version与Run.seq，LLM
        token仍通过run专用流传输。Last-Event-ID优先after，opaque游标绑定数据库、账户、工作区和项目，所有请求仍验证会话范围。初次或超过保留窗口发送stream.reset{reason,cursor}，客户端有界刷新必要列表并保留未确认操作/编辑，不能重新发送生成。兼容task快照和元数据可能共用cursor，断线时客户端须依据元数据补读，不依赖第二帧必达。memory保持内存广播且不跨重启。工作区上限429
        ADMISSION_STREAM_LIMIT、全局128上限503 STREAM_LIMIT；断开释放名额但不取消生成。
      responses:
        '200':
          description: text/event-stream：stream.reset、resource.changed、兼容task.updated及心跳。消费者checkpoint只代表已投影，不是浏览器确认。每项目保留2048条，已消费全局100000条；每批最多100条。
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - in: query
        name: project_id
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        description: PG持久通知opaque游标；优先于after。不接受跨账户、项目或数据库游标。
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - in: query
        name: after
        description: 仅在无Last-Event-ID时使用；PG格式同持久通知游标，不能填run数字seq。
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      x-event-data-schemas:
        resource.changed:
          $ref: '#/components/schemas/DurableResourceChanged'
        stream.reset:
          $ref: '#/components/schemas/DurableStreamReset'
        task.updated:
          type: object
          required:
          - task
          properties:
            task:
              $ref: '#/components/schemas/Task'
    parameters:
    - in: path
      name: workspace_id
      required: true
      schema:
        type: string
  /api/v1/auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              - name
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  writeOnly: true
                  description: 注册10至72 UTF-8字节，登录不得超过72字节
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '201':
          description: 成功并设置HttpOnly SameSite=Strict会话cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
