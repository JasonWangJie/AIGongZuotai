        aspect_ratio:
          type: string
        size:
          type: string
        resolution:
          type: string
        seconds:
          type: integer
          minimum: 1
          maximum: 600
      description: 完整可支持的参数组合。不可把不同预设的尺寸/比例/时长拼接；id和name仅供界面选择，不写入任务parameters。
    ModelCapabilities:
      type: object
      required:
      - cancel_supported
      - max_count
      - max_prompt_bytes
      - parameter_presets
      properties:
        cancel_supported:
          type: boolean
          description: 由实际执行模式生成，不由目录文件声明真实媒体已支持取消。
        max_count:
          type: integer
          minimum: 1
          maximum: 4
        max_prompt_bytes:
          type: integer
          maximum: 16000
          minimum: 1
        parameter_presets:
          type: array
          items:
            $ref: '#/components/schemas/ParameterPreset'
          maxItems: 32
        image_edit_supported:
          type: boolean
          description: 仅image可声明支持编辑；旧live配置未声明则关闭。
        max_reference_images:
          type: integer
          minimum: 0
          maximum: 4
          description: 关闭为0；启用编辑时1至4。历史快照可能缺少此字段。
        context_window_tokens:
          type: integer
          minimum: 0
          maximum: 1048576
          description: chat默认32768，非chat为0；历史快照可缺失。窗口与输出必须满足服务端预算规则，配置不代表供应商自动探测。
        max_output_tokens:
          type: integer
          minimum: 0
          maximum: 32768
          description: chat默认4096，非chat为0；历史快照可缺失。窗口与输出必须满足服务端预算规则，配置不代表供应商自动探测。
      description: chat预设为空；媒体按精确组合验证，video数量固定1。
    Model:
      type: object
      required:
      - id
      - name
      - kind
      - description
      - enabled
      - version
      - capabilities
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
        kind:
          type: string
          enum:
          - chat
          - image
          - video
        description:
          type: string
        enabled:
          type: boolean
        reason:
          type: string
        version:
          type: string
          description: 不透明能力版本；私有上游映射或能力变更均改变版本，不包含原始映射。
        capabilities:
          $ref: '#/components/schemas/ModelCapabilities'
    ModelCatalog:
      type: object
      required:
