          type: string
        title:
          type: string
          maxLength: 80
          description: 省略/空白使用新对话；不自动使用消息正文改名。
      additionalProperties: false
    ConversationRunInput:
      type: object
      required:
      - expected_version
      - model_id
      - operation
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        model_id:
          type: string
        model_version:
          type: string
        operation:
          type: string
          enum:
          - reply
          - continue
        parent_message_id:
          type:
          - string
          - 'null'
        edited_message_id:
          type:
          - string
          - 'null'
        input:
          type: string
          description: reply为非空且符合模型max_prompt_bytes的原文；continue必须省略或空，服务端固定继续指令。
        quote_id:
          type: string
          maxLength: 128
          description: credits模式新请求必须使用完整原输入对应的有效报价；旧键重放须保留原quote_id和正文，先于过期/余额检查。disabled模式不得提供。
      additionalProperties: false
      description: reply的parent是本会话终止assistant或空根；edited_message_id只允许同会话user且parent等于其原父节点，创建兄弟分支。continue必须指向有输出的终止assistant，不能包含edited_message_id。节点/路径分别最多256/128，客户端不能提交任意历史或角色。
    ChatContextSummary:
      type: object
      required:
