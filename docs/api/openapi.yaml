          minimum: 1
          maximum: 9007199254740991
        head_message_id:
          type:
          - string
          - 'null'
        active_run_id:
          type:
          - string
          - 'null'
        node_count:
          type: integer
          minimum: 0
          maximum: 32768
          description: 036 持久格式的会话总节点。默认新写上限 256，显式长会话配置上限 32768。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: 项目私有会话；初始version=1，只有受理新轮改变树头和版本。active_run_id为读取时快照，服务端仍保证同会话含全部分支最多一个活跃Run。
