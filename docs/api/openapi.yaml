      - pattern: '\S'
      - pattern: '^[^\u0000-\u001f\u007f-\u009f]*$'
      description: 至少包含一个非空白字符，禁用控制字符。UTF-8 至多 480 字节。
    SupportTicketText:
      type: string
      minLength: 1
      maxLength: 2000
