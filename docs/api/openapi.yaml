          minLength: 1
          maxLength: 120
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 32
        state:
          type: string
          enum:
          - active
          - trashed
        updated_at:
          type: string
          format: date-time
      description: 不可变元数据快照，无下载URL；选择旧name/tags可用当前expected_revision另存新版本。
    LibraryMutation:
      type: object
      additionalProperties: false
      required:
