          - run
          - project
          - draft
          - reference
          - asset
          - conversation
        resource_id:
          type: string
        resource_version:
          type: integer
          minimum: 0
        status:
          type: string
          description: 可为空字符串；不能代替读取最新资源。
        action:
          type: string
          description: audit.created时为既有闭集审计动作，其余为空字符串。
    DurableStreamReset:
      type: object
      additionalProperties: false
      required:
      - reason
