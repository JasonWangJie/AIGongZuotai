        max_pixels:
          type: integer
          const: 16000000
        max_dimension:
          type: integer
          const: 8192
        max_reference_images:
          type: integer
          const: 4
        allowed_content_types:
          type: array
          items:
            type: string
            enum:
            - image/png
            - image/jpeg
            - image/webp
        workspace_max_bytes:
          type: integer
          const: 134217728
          description: 原件和缩略图逻辑字节计入工作区限额。
        workspace_max_files:
          type: integer
          const: 100
      description: 平台本地限制，不是供应商通用限制。全目录额外限制2GiB/4096文件，含原件、预览、提交文件和孤立文件。
    ReferenceAsset:
      type: object
