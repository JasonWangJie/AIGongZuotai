          type: string
          minLength: 1
          maxLength: 1024
      description: 要求重新同步当前状态；不重新受理生成，不清除本地编辑。
    Conversation:
      type: object
      required:
      - id
      - project_id
      - title
      - version
      - head_message_id
      - active_run_id
      - node_count
      - created_at
      - updated_at
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
          maxLength: 80
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        head_message_id:
          type:
          - string
          - 'null'
        active_run_id:
          type:
          - string
          - 'null'
        node_count:
          type: integer
          minimum: 0
          maximum: 256
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: 项目私有会话；初始version=1，只有受理新轮改变树头和版本。active_run_id为读取时快照，服务端仍保证同会话含全部分支最多一个活跃Run。
    ConversationInput:
      type: object
      required:
      - project_id
      properties:
        project_id:
          type: string
        title:
          type: string
          maxLength: 80
          description: 省略/空白使用新对话；不自动使用消息正文改名。
      additionalProperties: false
    ConversationRunInput:
      type: object
      required:
      - expected_version
      - model_id
      - operation
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        model_id:
          type: string
        model_version:
          type: string
        operation:
          type: string
          enum:
          - reply
          - continue
        parent_message_id:
          type:
          - string
          - 'null'
        edited_message_id:
          type:
          - string
          - 'null'
        input:
          type: string
          description: reply为非空且符合模型max_prompt_bytes的原文；continue必须省略或空，服务端固定继续指令。
        quote_id:
          type: string
          maxLength: 128
          description: credits模式新请求必须使用完整原输入对应的有效报价；旧键重放须保留原quote_id和正文，先于过期/余额检查。disabled模式不得提供。
      additionalProperties: false
      description: reply的parent是本会话终止assistant或空根；edited_message_id只允许同会话user且parent等于其原父节点，创建兄弟分支。continue必须指向有输出的终止assistant，不能包含edited_message_id。节点/路径分别最多256/128，客户端不能提交任意历史或角色。
    ChatContextSummary:
      type: object
      required:
      - input_tokens_estimate
      - output_tokens_reserved
      - context_window_tokens
      - included_messages
      - omitted_messages
      - estimator
      properties:
        input_tokens_estimate:
          type: integer
          minimum: 0
        output_tokens_reserved:
          type: integer
          minimum: 128
          maximum: 32768
        context_window_tokens:
          type: integer
          minimum: 2048
          maximum: 1048576
        included_messages:
          type: integer
          minimum: 1
          maximum: 129
        omitted_messages:
          type: integer
          minimum: 0
        estimator:
          type: string
          const: utf8_bytes_v1
      description: 受理时冻结的上下文摘要；UTF-8字节+每条16+256余量的保守估算，不是实际token/账单。按完整旧轮裁剪；最新输入必留，continue还须保留来源轮，无法容纳422。
    ConversationMessage:
      type: object
      required:
      - id
      - conversation_id
      - parent_id
      - role
      - content
      - run_id
      - status
      - seq
      - created_at
      - updated_at
      properties:
        id:
