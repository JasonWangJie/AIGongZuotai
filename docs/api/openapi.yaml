        kind:
          type: string
          enum:
          - image
          - video
          - poster
        name:
          type: string
          minLength: 1
          maxLength: 120
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 32
        state:
          type: string
          enum:
          - active
          - trashed
        revision:
          type: integer
          minimum: 1
          maximum: 1000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        content_url:
          type:
          - string
          - 'null'
          description: 同源项目鉴权地址；trashed为null，不是S3直链。
        thumbnail_url:
          type:
          - string
          - 'null'
          description: 最长边512px的同源私有预览；无缩略图或trashed时null。Demo可为明确标示的SVG插画。
        content_type:
          type: string
        byte_size:
          type: integer
          minimum: 1
      description: 独立资产目录；原内容及来源不可变。修订历史是元数据历史，非二进制内容版本。不暴露bucket/key/hash/path/storage_info。旧已导入产物可能缺MIME/大小/缩略图，字段不伪造。
    LibraryRevision:
