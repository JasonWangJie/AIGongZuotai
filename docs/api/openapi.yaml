              - policy_concern
              - abuse_concern
      - if:
          properties:
            action:
              const: lift
        then:
          required:
          - restriction_id
          properties:
            restriction_id:
              type: string
              pattern: ^arst_[a-f0-9]{32}$
            appeal_id:
              const: ''
            expected_appeal_version:
              const: 0
            reason_code:
              type: string
              enum:
              - review_complete
              - restriction_error
      - if:
          properties:
            action:
              const: uphold
        then:
          required:
          - restriction_id
          - appeal_id
          - expected_appeal_version
          properties:
            restriction_id:
              type: string
              pattern: ^arst_[a-f0-9]{32}$
            appeal_id:
