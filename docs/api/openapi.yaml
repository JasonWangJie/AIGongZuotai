        required: true
        description: 仅application/json；原始正文最多8192字节，拒绝重复键、未知字段、大小写别名、无效UTF-8及多个JSON值。
        x-max-body-bytes: 8192
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationPlanInput'
  /api/v1/operations/generation-executions:
    post:
      operationId: operationsGenerationExecute
      security:
      - SessionCookie: []
      description: 需要OPERATIONS_ENABLED、PostgreSQL账户模式及目标工作区显式moderator授权。默认409 OPERATIONS_DISABLED；未授权范围404 OPERATIONS_NOT_FOUND。每次请求事务内重核会话和当前角色，普通owner及旧角色无自动权限。 提交当前密码；bcrypt在全局状态锁和业务事务外有界执行，再同事务重核会话、密码散列/凭据版本、授权、计划摘要、数据库身份、控制版本和OPEN申请集合。业务变更、申请答复、计划消费、不可变回执和安全审计原子提交；本域不改变生成、账务或审核决定，不发送项目Outbox。计划一次消费，重复执行409，不能用重试再次改变业务。网络/提交确认未知时立即清密码，仅GET原plan_id的receipt；不能自动再次POST执行或把404当成已证明未执行。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationReceipt'
        default:
          $ref: '#/components/responses/Error'
          description: 业务错误及服务端request_id；不泄漏SQL、凭据、用户说明或上游内容。
        '400':
          $ref: '#/components/responses/Error'
          description: INVALID_JSON或幂等键格式错误；正文只能为使用精确字段名的单个JSON对象。
        '413':
          $ref: '#/components/responses/Error'
          description: GENERATION_BODY_TOO_LARGE：请求正文超过8KiB或读取失败。
        '415':
          $ref: '#/components/responses/Error'
          description: UNSUPPORTED_MEDIA_TYPE：需要application/json。
        '403':
          $ref: '#/components/responses/Error'
          description: OPERATIONS_PASSWORD_INVALID或OPERATIONS_REAUTH_REQUIRED；未通过当前密码/凭据校验。
        '404':
          $ref: '#/components/responses/Error'
          description: NOT_FOUND或OPERATIONS_NOT_FOUND：计划不存在、被新解除预演替换、非原预演者或当前范围无权。
        '408':
          $ref: '#/components/responses/Error'
          description: OPERATIONS_REQUEST_CANCELLED：密码核验请求已取消。
        '409':
          $ref: '#/components/responses/Error'
          description: GENERATION_PLAN_CONSUMED、GENERATION_PLAN_EXPIRED、GENERATION_PLAN_CHANGED、GENERATION_CONTROL_CHANGED或GENERATION_VERSION_LIMIT；已消费只读原回执，其他失效重读后重新预演。
        '422':
          $ref: '#/components/responses/Error'
          description: INVALID_GENERATION_PLAN或INVALID_OPERATIONS_PASSWORD：严格小写64hex摘要/标识，密码10至72 UTF-8字节。
        '429':
          $ref: '#/components/responses/Error'
          description: OPERATIONS_RATE_LIMIT或AUTH_BUSY；Retry-After:15，不能自动重投密码。
      requestBody:
        required: true
        description: 仅application/json；原始正文最多8192字节，拒绝重复键、未知字段、大小写别名、无效UTF-8及多个JSON值。
        x-max-body-bytes: 8192
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationExecuteInput'
