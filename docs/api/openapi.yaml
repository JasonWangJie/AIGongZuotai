    - name: project
      in: path
      required: true
      schema: {type: string}
    - name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1, maximum: 128}
    - name: panel
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,48}$'}
    get:
      operationId: listPanelVideoAttempts
      description: 按尝试序号倒序读取固定分镜的项目视频任务。
      parameters:
      - name: before_attempt
        in: query
        schema: {type: integer, minimum: 1, maximum: 33}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 32, default: 16}
      responses:
        '200':
          description: 受理尝试与下一页游标。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelVideoPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: submitPanelVideo
      description: 用预览的原键、模型和规格显式生成这一镜。受理时核对原确认版、预期尝试、上一尝试终态和适用报价。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelVideoSubmit'
      responses:
        '201':
          description: 媒体任务及其已提交的分镜关联。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelVideoAttempt'
        '200':
          description: 同一作者、来源与请求的原受理回执。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelVideoAttempt'
        default:
          $ref: '#/components/responses/Error'
