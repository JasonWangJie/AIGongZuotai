      description: 仅安全摘要，不含规则/私有候选/端点/凭据。LLM须ALLOWED+COMPLETED，Task须ALLOWED+SUCCEEDED/PARTIAL；参考与资产仅批准后开放内容。审核version独立于资源seq/version/revision；nil历史不是审核通过，旧响应缺摘要不能解除已观察到的隔离。
    ModerationCapability:
      type: object
      additionalProperties: false
      required:
      - enabled
      - mode
      - text_delivery
      - media_supported
      - media_mode
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum:
          - disabled
          - rules
          - http
        policy_id:
          type: string
        policy_version:
          type: string
        text_delivery:
          type: string
          enum:
          - stream
          - after_review
        media_supported:
          type: boolean
        media_mode:
          type: string
          enum:
          - disabled
          - fixtures
          - http
        media_policy_id:
          type: string
          maxLength: 64
        media_policy_version:
          type: string
          maxLength: 64
      description: 当前新请求能力；文本rules仅demo有限规则。开启文本而未开启媒体审核时media_supported=false；两者开启才提供新媒体生成。fixtures匹配真实文件SHA/长度闭集，未知样本REVIEW；http是服务端私有media-v1适配，真实渠道另验收。旧原键重放优先。
    GenerationRestriction:
      type: object
      additionalProperties: false
      required:
      - id
      - reason_code
      - public_notice
      - created_at
      properties:
        id:
          type: string
          pattern: ^grst_[a-f0-9]{32}$
        reason_code:
          type: string
          enum:
          - manual_review
          - policy_concern
          - abuse_concern
        public_notice:
          type: string
          maxLength: 1024
          x-max-utf8-bytes: 1024
          description: 必须含非空白内容；最多1024个UTF-8字节，不是1024个汉字。允许换行LF，拒绝其他Unicode控制字符和格式字符；须为有效UTF-8。
        created_at:
          type: string
          format: date-time
      description: 当前限制episode的公开说明，不含内部证据或运营者身份。解除后该episode仍保留历史。
    GenerationAccess:
      type: object
      additionalProperties: false
      required:
      - workspace_id
      - state
      - version
      - can_appeal
      properties:
        workspace_id:
          type: string
          pattern: ^ws_[a-f0-9]{32}$
        state:
          type: string
          enum:
          - OPEN
          - RESTRICTED
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        restriction:
          $ref: '#/components/schemas/GenerationRestriction'
        can_appeal:
          type: boolean
          description: 用户投影仅在当前限制尚无自己的申请时为true；运营投影固定false，不代表运营处置权限。
      description: 无控制记录时OPEN/version=1；限制首次持久化为version=2。RESTRICTED含restriction，OPEN省略。状态不代表账户登录或内容审核是否获准。
    GenerationAppealInput:
      type: object
      additionalProperties: false
      required:
      - reason_code
      properties:
        reason_code:
          type: string
          enum:
          - request_review
          - restriction_error
          - issue_resolved
        statement:
          type: string
          maxLength: 1024
          x-max-utf8-bytes: 1024
          description: 可省略或为空；最多1024个UTF-8字节，不是1024个汉字。允许换行LF，拒绝其他Unicode控制字符和格式字符；须为有效UTF-8。
    GenerationAppealSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - workspace_id
      - restriction_id
      - state
      - version
      - reason_code
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^gapl_[a-f0-9]{32}$
        workspace_id:
          type: string
          pattern: ^ws_[a-f0-9]{32}$
        restriction_id:
          type: string
          pattern: ^grst_[a-f0-9]{32}$
        state:
          type: string
          enum:
          - OPEN
          - RESOLVED
        outcome:
          type: string
          enum:
          - UPHELD
          - LIFTED
        version:
          type: integer
          minimum: 1
          maximum: 2
        reason_code:
          type: string
          enum:
          - request_review
          - restriction_error
          - issue_resolved
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: 有界列表仅元信息，不含用户说明、公开答复或申请人身份。OPEN/version=1省略outcome；RESOLVED/version=2含outcome。
    GenerationAppeal:
      type: object
      additionalProperties: false
      required:
      - id
      - workspace_id
      - restriction_id
      - state
      - version
      - reason_code
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^gapl_[a-f0-9]{32}$
        workspace_id:
          type: string
          pattern: ^ws_[a-f0-9]{32}$
        restriction_id:
          type: string
          pattern: ^grst_[a-f0-9]{32}$
        state:
          type: string
          enum:
          - OPEN
          - RESOLVED
        outcome:
          type: string
          enum:
          - UPHELD
          - LIFTED
        version:
          type: integer
          minimum: 1
          maximum: 2
        reason_code:
          type: string
          enum:
          - request_review
          - restriction_error
          - issue_resolved
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        statement:
          type: string
          maxLength: 1024
          x-max-utf8-bytes: 1024
          description: 可省略或为空；最多1024个UTF-8字节，不是1024个汉字。允许换行LF，拒绝其他Unicode控制字符和格式字符；须为有效UTF-8。
        public_reply:
          type: string
          maxLength: 1024
          x-max-utf8-bytes: 1024
          description: 必须含非空白内容；最多1024个UTF-8字节，不是1024个汉字。允许换行LF，拒绝其他Unicode控制字符和格式字符；须为有效UTF-8。
      description: 仅申请人或目标工作区具有appeal_resolve权限的运营者可读。statement空时省略；public_reply只在已答复且非空时出现，不提供任何生成提示词或候选内容。
    GenerationAppealPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/GenerationAppealSummary'
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
      description: 按created_at、id降序的复合游标分页；next_cursor=null表示本次没有下一页。游标绑定账户、工作区、用户/运营模式及state筛选。
    GenerationEffect:
      type: object
      additionalProperties: false
      required:
      - from_state
      - to_state
      - version
      - restriction_id
      - affected_appeals
      properties:
        from_state:
          type: string
          enum:
          - OPEN
          - RESTRICTED
        to_state:
          type: string
          enum:
          - OPEN
          - RESTRICTED
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        restriction_id:
          type: string
          pattern: ^grst_[a-f0-9]{32}$
        affected_appeals:
          type: integer
          minimum: 0
          maximum: 128
      description: 真实预演/执行后的控制状态与版本，不是增量。restrict_future为新episode且0份申请；lift_restriction解除当前episode并答复其全部OPEN申请；uphold_restriction只答复选定申请，控制版本不变。
    GenerationPlanInput:
      type: object
      additionalProperties: false
      required:
      - workspace_id
      - action
      - expected_version
      - reason_code
      - evidence_ref
      - public_reply
      properties:
        workspace_id:
          type: string
          pattern: ^ws_[a-f0-9]{32}$
        action:
          type: string
          enum:
          - restrict_future
          - lift_restriction
          - uphold_restriction
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        restriction_id:
          anyOf:
          - type: string
            const: ''
          - type: string
            pattern: ^grst_[a-f0-9]{32}$
        appeal_id:
          anyOf:
          - type: string
            const: ''
          - type: string
            pattern: ^gapl_[a-f0-9]{32}$
        expected_appeal_version:
          type: integer
          minimum: 0
          maximum: 1
        reason_code:
          type: string
          enum:
          - manual_review
          - policy_concern
          - abuse_concern
          - review_complete
          - restriction_error
        evidence_ref:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
          description: 内部安全ASCII短标识，禁止包含://，不得填URL、密码、密钥或正文。
        public_reply:
          type: string
          maxLength: 1024
          x-max-utf8-bytes: 1024
          description: 必须含非空白内容；最多1024个UTF-8字节，不是1024个汉字。允许换行LF，拒绝其他Unicode控制字符和格式字符；须为有效UTF-8。
      description: 目标工作区显式指定，不继承创作项目。限制时public_reply成为公开限制说明；解除/维持时成为申请答复。reason_code按action校验；不接收任意身份、生成正文或账务操作。
      allOf:
      - if:
          properties:
            action:
              const: restrict_future
        then:
          properties:
            restriction_id:
              const: ''
            appeal_id:
              const: ''
            expected_appeal_version:
              const: 0
            reason_code:
              type: string
              enum:
              - manual_review
              - policy_concern
              - abuse_concern
      - if:
          properties:
            action:
              const: lift_restriction
        then:
          required:
          - restriction_id
          properties:
            restriction_id:
              type: string
              pattern: ^grst_[a-f0-9]{32}$
            appeal_id:
              const: ''
            expected_appeal_version:
              const: 0
            reason_code:
              type: string
              enum:
              - review_complete
              - restriction_error
      - if:
          properties:
            action:
              const: uphold_restriction
        then:
          required:
          - restriction_id
          - appeal_id
          - expected_appeal_version
          properties:
            restriction_id:
              type: string
              pattern: ^grst_[a-f0-9]{32}$
            appeal_id:
              type: string
              pattern: ^gapl_[a-f0-9]{32}$
            expected_appeal_version:
              const: 1
            reason_code:
              type: string
              enum:
              - manual_review
              - policy_concern
              - abuse_concern
    GenerationPlan:
      type: object
      additionalProperties: false
      required:
      - id
      - workspace_id
      - action
      - expected_version
      - plan_digest
      - expires_at
      - effect
      properties:
        id:
          type: string
          pattern: ^gplan_[a-f0-9]{32}$
        workspace_id:
          type: string
          pattern: ^ws_[a-f0-9]{32}$
        action:
          type: string
          enum:
          - restrict_future
          - lift_restriction
          - uphold_restriction
        expected_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        restriction_id:
          type: string
          pattern: ^grst_[a-f0-9]{32}$
        appeal_id:
          type: string
          pattern: ^gapl_[a-f0-9]{32}$
        plan_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        expires_at:
          type: string
          format: date-time
        effect:
          $ref: '#/components/schemas/GenerationEffect'
      description: 五分钟有效的一次性预演。摘要绑定数据库身份、用户/会话/凭据/授权版本、输入、控制episode及当前OPEN申请集合；不返回内部证据、密码或用户说明。限制预演返回拟创建的restriction_id，其他动作返回原episode。
    GenerationExecuteInput:
      type: object
      additionalProperties: false
      required:
      - workspace_id
      - plan_id
      - plan_digest
      - password
      properties:
        workspace_id:
          type: string
          pattern: ^ws_[a-f0-9]{32}$
        plan_id:
          type: string
          pattern: ^gplan_[a-f0-9]{32}$
        plan_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          x-min-utf8-bytes: 10
          x-max-utf8-bytes: 72
          description: 当前密码，实际校验10至72个UTF-8字节；只在当前请求内使用，不能放入恢复仓、日志或持久计划。
    GenerationReceipt:
      type: object
      additionalProperties: false
      required:
      - id
      - plan_id
      - workspace_id
      - action
      - effect
      - executed_at
      properties:
        id:
          type: string
          pattern: ^grec_[a-f0-9]{32}$
        plan_id:
          type: string
          pattern: ^gplan_[a-f0-9]{32}$
        workspace_id:
          type: string
          pattern: ^ws_[a-f0-9]{32}$
        action:
          type: string
          enum:
          - restrict_future
          - lift_restriction
          - uphold_restriction
        effect:
          $ref: '#/components/schemas/GenerationEffect'
        executed_at:
          type: string
          format: date-time
      description: 与控制状态、申请答复、计划消费和安全审计同一事务提交的不可变回执。无账务、内容重审或生成副作用；并非真实资金退款回执。
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: studio_session
      description: 仅AUTH_MODE=required时必需。HttpOnly/SameSite=Strict，7天过期；TLS下Secure。
    MetricsBearer:
      type: http
      scheme: bearer
      description: 独立METRICS_TOKEN，32至256可见ASCII字符，不得复用AI密钥；普通账户cookie不能访问，未配置404。
security:
- SessionCookie: []
