  /api/v1/workspaces/{workspace_id}/events:
    get:
      operationId: subscribeWorkspace
      description: PG模式按项目持久通知流：resource.changed仅含资源标识/版本/状态和闭集动作；task.updated附带读取时当前授权Task快照，不能视为事件当时的完整快照。通知序号独立于Task.version与Run.seq，LLM token仍通过run专用流传输。Last-Event-ID优先after，opaque游标绑定数据库、账户、工作区和项目，所有请求仍验证会话范围。初次或超过保留窗口发送stream.reset{reason,cursor}，客户端有界刷新必要列表并保留未确认操作/编辑，不能重新发送生成。兼容task快照和元数据可能共用cursor，断线时客户端须依据元数据补读，不依赖第二帧必达。memory保持内存广播且不跨重启。工作区上限429
        ADMISSION_STREAM_LIMIT、全局128上限503 STREAM_LIMIT；断开释放名额但不取消生成。
      responses:
        '200':
          description: text/event-stream：stream.reset、resource.changed、兼容task.updated及心跳。消费者checkpoint只代表已投影，不是浏览器确认。每项目保留2048条，已消费全局100000条；每批最多100条。
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - in: query
        name: project_id
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        description: PG持久通知opaque游标；优先于after。不接受跨账户、项目或数据库游标。
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - in: query
        name: after
        description: 仅在无Last-Event-ID时使用；PG格式同持久通知游标，不能填run数字seq。
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      x-event-data-schemas:
        resource.changed:
          $ref: '#/components/schemas/DurableResourceChanged'
        stream.reset:
          $ref: '#/components/schemas/DurableStreamReset'
        task.updated:
          type: object
          required:
          - task
          properties:
            task:
              $ref: '#/components/schemas/Task'
    parameters:
    - in: path
      name: workspace_id
      required: true
      schema:
        type: string
