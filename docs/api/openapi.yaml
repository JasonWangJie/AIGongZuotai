      - resource_id
      - resource_version
      - status
      - action
      properties:
        event_id:
          type: string
          pattern: ^evt_[a-f0-9]{32}$
        seq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        kind:
          type: string
