  /api/v1/library:
    get:
      operationId: listLibrary
      description: 独立当前项目目录，created_at+id倒序keyset；游标绑定所有过滤条件与项目，q为名称/标签文本包含，tag规范化精确匹配，不解释SQL通配符。
      parameters:
      - $ref: '#/components/parameters/ProjectHeader'
      - name: project_id
        in: query
        schema:
          type: string
        description: 与项目头同时指定时必须一致。
      - name: state
        in: query
        schema:
          type: string
          enum:
          - active
          - trashed
          default: active
      - name: source
        in: query
        schema:
          type: string
          enum:
          - reference
          - generated
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - image
          - video
          - poster
      - name: q
        in: query
        schema:
          type: string
          maxLength: 128
      - name: tag
        in: query
        schema:
          type: string
          maxLength: 32
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      responses:
        '200':
          description: 资产目录
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                - has_more
                - limit
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LibraryEntry'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
                  limit:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
  /api/v1/library/{id}:
    get:
      operationId: getLibraryEntry
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/ProjectHeader'
      - name: project_id
        in: query
        schema:
          type: string
        description: 与项目头同时指定时必须一致。
      description: 当前项目active或trash元数据。
      responses:
        '200':
          description: 资产元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateLibraryEntry
      description: 先项目授权和结构校验，再原键重放，再CAS/状态校验；同键异body409 IDEMPOTENCY_CONFLICT，旧revision409 ASSET_REVISION_CONFLICT。trashed不得PATCH；状态冲突409 ASSET_STATE_CONFLICT。最多1000修订，trash提前保留一个恢复名额，容量不足429 ASSET_REVISION_LIMIT。原件不物理删除，原任务冻结正文不改变。
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/ProjectHeader'
      - name: project_id
        in: query
        schema:
          type: string
        description: 与项目头同时指定时必须一致。
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryMutation'
      responses:
        '200':
          description: 受理或返回原幂等响应；较旧重放不能覆盖客户端较新revision。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
            X-Request-ID:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
