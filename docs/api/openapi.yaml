        conversation_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        run_id:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - CANCELLED
          - FAILED
          - INTERRUPTED
        seq:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        model_id:
          type: string
        model_name:
          type: string
        error:
          $ref: '#/components/schemas/ResourceError'
        moderation:
          $ref: '#/components/schemas/ModerationSummary'
      description: user原文/父节点不可变；assistant引用Run，其内容/状态/seq由Run读取。user固定COMPLETED/seq0。部分输出可能在重启后回到最后检查点。
    ConversationBranch:
      type: object
