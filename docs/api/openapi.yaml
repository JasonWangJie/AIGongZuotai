        max_output_tokens:
          type: integer
          minimum: 0
          maximum: 32768
          description: chat默认4096，非chat为0；历史快照可缺失。窗口与输出必须满足服务端预算规则，配置不代表供应商自动探测。
      description: chat预设为空；媒体按精确组合验证，video数量固定1。
