              schema:
                type: string
              description: 服务端请求编号。
        default:
          $ref: '#/components/responses/Error'
  /api/v1/references:
    get:
      operationId: listReferences
      description: 仅列当前项目参考素材；通过原分页limit/offset读取。 V08起排除回收站中的参考素材。
      parameters:
      - $ref: '#/components/parameters/ProjectHeader'
      - name: project_id
        in: query
        schema:
          type: string
        description: 当前工作区项目；与X-Project-ID同时提供时必须一致。
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      responses:
        '200':
          description: 当前项目列表
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - limit
                - offset
                - has_more
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferenceAsset'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: uploadReference
      description: 单个file part，不接受额外字段/文件。先验证账户项目，再流式接收、真实格式/像素预算/完整解码和预览；只支持PNG/JPEG/WebP，不接受GIF/SVG或mask。幂等按项目+规范化文件名+原字节摘要及大小计算；原件/预览文件先发布，元数据/上传幂等/审计同事务。断线不等于未受理，保留原File/key核对；孤立文件可用离线维护计划核对后回收；已注册含trash的引用仍保留。
        媒体审核启用时，私有落盘后同步检查完整原件；只有ALLOW才201注册参考/资产/批准摘要。被拒或审核未知不创建参考记录，已知原上传键优先。网络受理不明保留File/key；不可把审核失败当作已保存参考。
      parameters:
      - $ref: '#/components/parameters/ProjectHeader'
      - name: project_id
        in: query
        schema:
          type: string
        description: 当前工作区项目；与X-Project-ID同时提供时必须一致。
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 单张最多8MiB，完整有效图像最多1600万像素，单边不超过8192。
      responses:
        '201':
          description: 已受理或原上传重放；同key内容相同返回原ID，新multipart boundary不改变幂等。
          headers:
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceAsset'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '507':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
