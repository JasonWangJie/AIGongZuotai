      allOf:
      - pattern: '\S'
      - pattern: '^[^\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f]*$'
      description: UTF-8 至多 6000 字节。至少包含一个非空白字符，控制字符仅可使用制表符、回车和换行。
