      required: true
      schema:
        type: string
        pattern: ^rskrev_[a-f0-9]{32}$
    RiskPlan:
      name: plan
      in: path
      required: true
      schema:
        type: string
        pattern: ^rskpl_[a-f0-9]{32}$
    RiskCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    RiskState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
        - all
        - OPEN
        - APPROVED
        - DENIED
    RiskOriginalKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
      description: 绑定本人原报价及完整复核申请。确认不明时用同一原键查询。
    AccountGovernanceTarget:
      in: path
      name: target
      required: true
      schema:
        type: string
        pattern: ^usr_[a-f0-9]{32}$
    AccountGovernanceAppeal:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: ^aapl_[a-f0-9]{32}$
    AccountGovernancePlan:
      in: path
      name: plan
      required: true
      schema:
        type: string
        pattern: ^aplan_[a-f0-9]{32}$
    AccountGovernanceKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
      description: 绑定当前申请人、原账户限制轮次和原始输入。响应未知时使用同一键查询回执。
    AccountGovernanceCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: 绑定操作人、目标账户、列表模式与筛选状态的分页游标。
    ResourceID:
      in: path
      name: id
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: 按工作区和操作去重；PostgreSQL模式跨重启持久，memory模式限当前进程。网络重试必须保持原键与payload。
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[a-zA-Z0-9._:-]+$
    ProjectHeader:
      in: header
      name: X-Project-ID
      schema:
        type: string
      description: 可选当前项目；必须属于当前工作区，与project_id查询参数同时提供时应一致。
    GenerationWorkspace:
      name: workspace_id
      in: query
      required: true
      schema:
        type: string
        pattern: ^ws_[a-f0-9]{32}$
      description: 独立运营工作区作用域；不可用X-Project-ID替代，不从创作项目推导权限。
    GenerationAppealState:
      name: state
      in: query
      schema:
        type: string
        enum:
        - all
        - OPEN
        - RESOLVED
        default: all
    GenerationAppealLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    GenerationAppealCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: 服务端复合游标；绑定当前用户、工作区、用户/运营模式及state，跨范围使用返回400 INVALID_CURSOR。
    GenerationAppealIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
      description: 工作区+申请人范围内持久幂等，绑定原restriction_id和完整reason_code/statement。未知响应保留原键与原输入，先只读核对；如显式重放须完全相同，不自动换键。
  responses:
    Error:
      description: JSON业务错误附服务端request_id。V16-A1聊天等待队列满503 RUN_QUEUE_FULL及工作区等待队列满429 EXECUTION_WORKSPACE_QUEUE_LIMIT均明确本次新请求未受理，Retry-After:3；原幂等查询优先，不能据本次拒收清除以前未知请求。执行预算与资源准入分开，单控制写者内按工作区轮转，不保证耗时公平。429准入拒绝带Retry-After:3且本次未新受理；不能用一次重试拒绝清除以前受理未知的原请求。DB失联503停止执行，不回退memory。 PG通知积压满时变更返回503 EVENT_BACKLOG_FULL，业务与事件事务一起回滚，原幂等键可在恢复后重试；这不同于提交结果未知。事件游标无效400 INVALID_EVENT_CURSOR，未来游标409
        EVENT_CURSOR_AHEAD。 账户安全：MAIL_UNAVAILABLE=503，AUTH_DISABLED=409，AUTH_REQUIRED=401，ACCOUNT_TOKEN_INVALID=400。安全操作缺失响应不代表未执行，核对账户/重新登录，不能盲目重投密码或令牌。 V14-C1新生成/新报价403 GENERATION_RESTRICTED不影响既有原键回放；本次拒绝不能清掉先前未知请求。复核/预演/执行429由实际处理器带Retry-After:15，只有真正返回该头时生效。敏感执行未知只读原计划回执，不自动重投密码或执行。
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                $ref: '#/components/schemas/HTTPError'
      headers:
        X-Request-ID:
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 认证限流900秒、bcrypt槽位或资源准入繁忙3秒；只对实际带此头的响应生效。
