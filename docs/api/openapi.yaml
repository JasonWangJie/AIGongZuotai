      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OperationsCase'
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    OperationsCaseEventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OperationsCaseEvent'
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    ModerationSummary:
      type: object
      additionalProperties: false
      required:
      - policy_id
      - policy_version
      - phase
      - state
      - version
      properties:
        policy_id:
          type: string
          maxLength: 64
        policy_version:
          type: string
          maxLength: 64
        phase:
          type: string
          enum:
          - output
        state:
          type: string
          enum:
          - PENDING
          - ALLOWED
          - BLOCKED
          - REVIEW
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        reason_code:
          type: string
          enum:
          - allowed
          - policy_block
          - policy_review
          - check_unavailable
          - check_protocol
          - check_timeout
          - check_busy
          - invalid_content
          - content_too_large
          - policy_unavailable
          - generation_incomplete
          - execution_incomplete
          - process_restarted
          - cancelled
      description: 仅安全摘要，无规则/候选正文/endpoint/凭据。只有ALLOWED且运行COMPLETED开放正文；nil或缺失为历史/未启用，并非审核通过。审核version与资源seq分别比较。
    ModerationCapability:
      type: object
      additionalProperties: false
      required:
      - enabled
      - mode
      - text_delivery
      - media_supported
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum:
          - disabled
          - rules
          - http
        policy_id:
          type: string
        policy_version:
          type: string
        text_delivery:
          type: string
          enum:
          - stream
          - after_review
        media_supported:
          type: boolean
      description: 当前新请求能力。rules仅demo有限规则；http为私有text-v1适配，真实渠道另验收。enabled时本轮媒体新请求不支持，已受理请求仍原幂等优先。
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: studio_session
      description: 仅AUTH_MODE=required时必需。HttpOnly/SameSite=Strict，7天过期；TLS下Secure。
    MetricsBearer:
      type: http
      scheme: bearer
      description: 独立METRICS_TOKEN，32至256可见ASCII字符，不得复用AI密钥；普通账户cookie不能访问，未配置404。
security:
- SessionCookie: []
