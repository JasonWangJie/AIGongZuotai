          format: date-time
        updated_at:
          type: string
          format: date-time
        model_id:
          type: string
        model_name:
          type: string
        error:
          $ref: '#/components/schemas/ResourceError'
        moderation:
          $ref: '#/components/schemas/ModerationSummary'
      description: user原文/父节点不可变；assistant引用Run，其内容/状态/seq由Run读取。user固定COMPLETED/seq0。部分输出可能在重启后回到最后检查点。
