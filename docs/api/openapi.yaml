    OrderPaymentProjection:
      type: object
      additionalProperties: false
      description: 本人订单的已认证经济事实、绑定环境与 CREDIT 处理结果。测试环境的结果单独标为 test。所有金额均使用十进制整数字符串。
      required: [order_id, currency, currency_exponent, environment, payment_state, refund_state, credit_state, paid_minor, refunded_minor, granted_credit_micros, reversed_credit_micros]
      properties:
        order_id:
          type: string
          pattern: '^ord_[0-9a-f]{32}$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: 该订单冻结的币种。
        currency_exponent:
          type: integer
          minimum: 0
          maximum: 3
          description: 从最小货币单位换算为主要单位时使用的十进制位数。
        environment:
          type: string
          enum: ['', test, live]
          description: 无独立绑定时为空字符串；已绑定时返回来源环境。
        payment_state:
          type: string
          enum: [UNBOUND, AWAITING, RECEIVED, REVIEW]
          description: UNBOUND 表示无绑定，AWAITING 表示已有绑定但尚待收款证据；RECEIVED 表示已记录收款，REVIEW 表示须核实。意向登记与欠款义务分别判断。
        refund_state:
          type: string
          enum: [NONE, PENDING_MATCH, PARTIAL, FULL, REVIEW]
          description: 分别表示没有已记录的退款、退款待匹配原支付、部分退款、全额退款及退款须核实。
        credit_state:
          type: string
          enum: [NOT_ISSUED, ISSUED, REVIEW]
          description: 该笔订单的 CREDIT 分别处于未发放、已发放或待核实状态。
        paid_minor:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: 归属明确、与本订单币种匹配的已记录收款总额，单位为该币种最小单位。
        refunded_minor:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: 本订单已记录且归属和币种明确的退款金额，单位同 paid_minor。退款先到时可为正数，PENDING_MATCH 表示尚待匹配原收款。
        granted_credit_micros:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: 原账本实际发放的 CREDIT 微点。每 1000000 微点等于 1 CREDIT；退款需复核时仍可核对此数。
        reversed_credit_micros:
          type: string
          const: '0'
          description: 已冲回的 CREDIT 微点。035 对退款保留原发放，当前恒为零。
