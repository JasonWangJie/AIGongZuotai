  /api/v1/conversations/{id}/runs:
    parameters:
    - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: createConversationRun
      description: '同键同原请求优先于CAS/目录/忙/限额返回原资源；异参409。状态/节点/Run/冻结上下文/幂等/审计/Outbox同事务，确认不明保留原body/key，不自动重新生成。 409 CONVERSATION_VERSION_CONFLICT/CONVERSATION_BUSY，422父节点/编辑/继续/预算错误，429 CONVERSATION_LIMIT。继续生成固定新user指令并创建新Run，可能消耗额度，不续接原供应商连接。

        审核开启时原键优先。新文本先审核实际完整上下文，锁外调用后重核摘要/CAS；确定拒绝不生成/冻结。MODERATION_INPUT_BLOCKED(422)、MODERATION_INPUT_REVIEW(409)、MODERATION_INPUT_INVALID(422)、MODERATION_UNAVAILABLE(503)、MODERATION_BUSY(429)均为前置未受理；先前受理不明的请求仍保留原body/key。文本审核开启但媒体审核未开启时，新媒体返回MODERATION_MEDIA_UNSUPPORTED(422)。
        V14-C1：原生成幂等键与相同原输入重放优先于当前工作区限制。新请求在锁外审核/磁盘准备前及最终受理事务重核；RESTRICTED返回403 GENERATION_RESTRICTED，本次零新资源/消息/冻结/报价消费/幂等占用。不能用此次明确拒绝清除更早受理不明的原body/key/quote；解除后也不自动重发。'
      parameters:
      - $ref: '#/components/parameters/ProjectHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRunInput'
      responses:
        '201':
          description: 已受理或原幂等请求重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          headers:
            Idempotency-Replayed:
              description: 仅幂等重放时为 true
              schema:
                type: string
                const: 'true'
            X-Request-ID:
              schema:
                type: string
                pattern: ^req_[a-f0-9]{32}$
              description: 服务端生成。标准静态文件/Range错误可通过此头反馈。
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: GENERATION_RESTRICTED：当前新请求确定未受理，原键已受理重放仍返回原资源；以前未知请求仍须保留原body/key。
