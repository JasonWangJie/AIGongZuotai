        thumbnail_url:
          type: string
          description: 同源受鉴权PNG预览，最长边512像素。
      description: 不返回存储路径、内容摘要、blob ID或供应商信息。移出本次选择不删除服务器记录。
    LibraryEntry:
      type: object
      required:
      - id
      - project_id
      - source
      - kind
      - name
      - tags
      - state
      - revision
      - created_at
      - updated_at
      - deleted_at
      - content_url
      - thumbnail_url
      properties:
        id:
