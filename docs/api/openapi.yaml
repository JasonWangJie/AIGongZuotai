        body: {$ref: '#/components/schemas/SupportTicketText'}
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          pattern: '^[^\u0000]*$'
          x-min-utf8-bytes: 10
          x-max-utf8-bytes: 72
          description: 当前登录客服的密码。服务器按 UTF-8 字节计数，须为 10 至 72 字节。仅本次回复使用。
    SupportTicketFields:
