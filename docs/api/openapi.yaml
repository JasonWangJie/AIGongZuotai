components:
  parameters:
    SupportTicketID:
      name: ticket
      in: path
      required: true
      schema: {type: string, pattern: '^tkt_[a-f0-9]{32}$'}
    SupportTicketWorkspace:
      name: workspace_id
      in: query
      required: true
      description: 客服 GET 显式选择的已授权工作区。
      schema: {type: string, pattern: '^ws_[a-f0-9]{32}$'}
    SupportTicketCursor:
      name: cursor
      in: query
      description: 可省略。沿用本人、工作区和本人或客服视图的原分页游标。页长固定为 20。
      schema: {type: string, maxLength: 640}
    SupportTicketOriginalKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同工作区、同操作者和同操作独立核对。回应不明时携原键只读相应收据。
      schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    SupportTicketOwnerOperation:
      name: operation
      in: query
      required: true
      schema: {type: string, enum: [create, followup, close]}
    SupportTicketReplyOperation:
      name: operation
      in: query
      required: true
      schema: {type: string, const: reply}
    RiskProject:
      name: project_id
      in: query
      required: true
      schema:
        type: string
        pattern: ^prj_[a-f0-9]{32}$
    RiskQuote:
      name: quote_id
      in: query
      required: true
      schema:
        type: string
        pattern: ^quo_[a-f0-9]{32}$
    RiskAppeal:
      name: id
