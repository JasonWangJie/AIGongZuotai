          type: integer
          minimum: 128
          maximum: 32768
        context_window_tokens:
          type: integer
          minimum: 2048
          maximum: 1048576
        included_messages:
          type: integer
          minimum: 1
          maximum: 129
        omitted_messages:
          type: integer
          minimum: 0
        estimator:
          type: string
          const: utf8_bytes_v1
      description: 受理时冻结的上下文摘要；UTF-8字节+每条16+256余量的保守估算，不是实际token/账单。按完整旧轮裁剪；最新输入必留，continue还须保留来源轮，无法容纳422。
