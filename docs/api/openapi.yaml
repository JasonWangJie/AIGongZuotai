  /api/v1/order-intents/{order}/payment-status:
    parameters:
    - name: order
      in: path
      required: true
      schema:
        type: string
        pattern: '^ord_[0-9a-f]{32}$'
    get:
      operationId: getOwnOrderPaymentStatus
      description: 以当前普通账户会话及其工作区核对原订单、已认证资金记录和实际 CREDIT 处理。商品目录关闭后仍可读。查询无需原操作键。
      responses:
        '200':
          description: 原订单存在。未绑定来源或尚无收款证据时也返回对应状态。
          headers:
            Cache-Control:
              schema: {type: string, const: 'no-store'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaymentProjection'
        '401':
          $ref: '#/components/responses/Error'
          description: 当前普通账户会话缺失或已失效。
        '403':
          $ref: '#/components/responses/Error'
          description: 账户受限或同源检查拒绝请求。
        '404':
          $ref: '#/components/responses/Error'
          description: ORDER_INTENT_NOT_FOUND，当前用户与工作区下找不到此订单。
        '501':
          $ref: '#/components/responses/Error'
          description: ORDER_INTENT_STORAGE_REQUIRED，需要 PostgreSQL 和真实账户鉴权。
        '503':
          $ref: '#/components/responses/Error'
          description: 服务停止接单或数据库不可用。
        default:
          $ref: '#/components/responses/Error'
  /api/v1/order-intents/{order}/cancel:
