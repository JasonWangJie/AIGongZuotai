      - leaf_message_id
      - parent_message_id
      - run_id
      - status
      - preview
      - created_at
      properties:
        leaf_message_id:
          type: string
        parent_message_id:
          type:
          - string
          - 'null'
        run_id:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - CANCELLED
          - FAILED
          - INTERRUPTED
        preview:
          type: string
          maxLength: 160
        created_at:
          type: string
          format: date-time
        moderation:
          $ref: '#/components/schemas/ModerationSummary'
    ConversationPage:
