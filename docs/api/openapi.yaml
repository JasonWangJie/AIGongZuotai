      - tags
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 1000
        name:
          type: string
          minLength: 1
          maxLength: 120
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 32
      description: 名称trim，标签trim+转小写去重；拒绝控制字符。
    LibraryTransition:
      type: object
      additionalProperties: false
      required:
      - expected_revision
