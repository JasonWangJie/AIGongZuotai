        aspect_ratio:
          type: string
        size:
          type: string
        resolution:
          type: string
        seconds:
          type: integer
          minimum: 0
          maximum: 600
          description: 0或省略从匹配预设填充，video有效结果为1..600。
        count:
          type: integer
          minimum: 0
          maximum: 4
          description: 0或省略使用1；有效结果不超过所选模型max_count，视频固定1。
      description: 有效规格必须匹配所选模型的一个parameter_presets。缺省按服务端目录规则填充；新客户端应提交完整所选组合。
    ReferenceLimits:
