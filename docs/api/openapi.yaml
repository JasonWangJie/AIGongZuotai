      in: path
      schema:
        type: string
      required: true
    post:
      operationId: cancelOwnOrderIntent
      description: 对仍待处理的本人意向做版本核对并取消。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIntentCancelInput'
      responses:
        '200':
          description: 对仍待处理的本人意向做版本核对并取消。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderIntent'
        '409':
          $ref: '#/components/responses/Error'
          description: 新取消遇到已认证资金记录时返回 ORDER_PAYMENT_RECORDED；原键重放仍按原收据处理，另有原键冲突或版本冲突。
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/data-export:
    post:
      operationId: downloadOwnAccountData
      security:
      - SessionCookie: []
      description: 本人三类资料逐页下载，每页核验当前密码与有效会话。支持受限账户。附件至多 512 KiB。下一页使用同分区原游标，首页确定创建截止时间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountExportInput'
      responses:
        '200':
          description: 本人 UTF-8 JSON 附件
          headers:
            Cache-Control:
              required: true
              schema:
                const: private, no-store
            Content-Disposition:
              required: true
              schema:
                type: string
                example: attachment; filename="account-profile.json"
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 524288
            X-Content-SHA256:
              required: true
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExportDocument'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/support/tickets:
    get:
      operationId: listOwnSupportTickets
      description: 按当前会话工作区和本人列出工单。每页固定 20 条，按创建时间及 ID 倒序。查询仅接受 cursor，列表仅含摘要。
      parameters:
        - $ref: '#/components/parameters/SupportTicketCursor'
      responses:
        '200':
          description: 有界工单摘要及后续游标。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketPage'
        '400':
          $ref: '#/components/responses/Error'
          description: 无效的查询字段、游标、操作或原键，或 GET 请求带正文。
        '401':
          $ref: '#/components/responses/Error'
          description: 缺少有效登录会话。
        '403':
          $ref: '#/components/responses/Error'
          description: 账户受限或请求被同源保护拒绝。
        '501':
          $ref: '#/components/responses/Error'
          description: 环境不具备持久账户模式。
        '503':
          $ref: '#/components/responses/Error'
          description: 数据库不可用或已提交的消息明细不完整。
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createOwnSupportTicket
      description: 创建本人站内工单。当前工作区每人最多 8 笔开放工单；原键重放先于容量检查。
      parameters:
        - $ref: '#/components/parameters/SupportTicketOriginalKey'
      requestBody:
        required: true
        description: 最大 32 KiB 的单个 UTF-8 JSON 对象，拒绝重复、未知、大小写别名或 null 字段。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketCreateInput'
      responses:
        '201':
          description: 已创建本人工单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketDetail'
        '200':
          description: 同键同请求的原创建结果。
          headers:
            Idempotency-Replayed:
              description: 匹配原键与原请求时返回。
              schema: {type: string, const: 'true'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketDetail'
